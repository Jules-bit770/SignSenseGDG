<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SignSense Signup</title> 
        <link rel="stylesheet" href="signup.css">
    </head>
    <body><main class="auth-card"><a class="auth-brand" href="index.html"><span aria-hidden="true">&#9679; <i>&#9679;</i> <em>&#9679;</em> <strong>&#9679;</strong></span> SignSense</a><div class="eyebrow">LEARN. CONNECT. BELONG.</div>
        <h1>Your first connection starts here.</h1>
        <p class="sub">Create your account and learn one sign at a time.</p>
        <form id="signupForm">
            <div class="input-row">
                <img src="man.png" alt="Man Icon">
                <input type="text" name="username" id="username-input" aria-label="Username" autocomplete="username" placeholder="Username" required>
            </div>
           <div class="input-row">
                <label for="email-input">
                <span>@</span>
                </label>
                <input type="email" name="email" id="email-input" aria-label="Email" autocomplete="email" placeholder="Email" required>
            </div>
            <div class="input-row">
                <img src="lock.png" alt="Lock Icon">
                <input type="password" name="password" id="password-input" aria-label="Password" autocomplete="new-password" placeholder="Password" required>
            </div>
            <div class="input-row">
                <button type="submit">Sign up</button>
            </div>   
        </form><p id="form-error" role="alert"></p>
        <p>Already have an account? <a href="index.html">Login here</a></p>

        </main><script>
            document.getElementById('signupForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const username = document.getElementById('username-input').value.trim();
                const email = document.getElementById('email-input').value.trim();
                const password = document.getElementById('password-input').value;

                let users = JSON.parse(localStorage.getItem('users')) || {};

                if (users[username]) {
                    document.getElementById('form-error').textContent = 'That username is already taken. Try another.';
                    return;
                }

                users[username] = { email: email, password: password }; // NOTE: plain text, demo only
                localStorage.setItem('users', JSON.stringify(users));

                alert('Account created! Please sign in.');
                window.location.href = 'index.html';
            });
        </script>
    </body>
</html>
