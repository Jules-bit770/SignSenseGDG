<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SignSense Login</title> 
        <link rel="stylesheet" href="signup.css">
    </head>
    <body><main class="auth-card"><a class="auth-brand" href="index.html"><span aria-hidden="true">&#9679; <i>&#9679;</i> <em>&#9679;</em> <strong>&#9679;</strong></span> SignSense</a><div class="eyebrow">LEARN. CONNECT. BELONG.</div>
        <h1>Good to see you again.</h1>
        <p class="sub">A little practice today. A stronger connection tomorrow.</p>
        <form id="signinForm">
            <div class="input-row">
                <img src="man.png" alt="Man Icon">
                <input type="text" name="username" id="username-input" aria-label="Username" autocomplete="username" placeholder="Username" required>
            </div>
            <div class="input-row">
                <img src="lock.png" alt="Lock Icon">
                <input type="password" name="password" id="password-input" aria-label="Password" autocomplete="current-password" placeholder="Password" required>
            </div>
            <div class="input-row">
                <button type="submit">Continue to your islands &rarr;</button>
            </div>   
        </form><p id="form-error" role="alert"></p>
        <p>Don't have an account? <a href="signup.html">Sign up here</a></p>

        </main><script>
            document.getElementById('signinForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const username = document.getElementById('username-input').value.trim();
                const password = document.getElementById('password-input').value;

                let users = JSON.parse(localStorage.getItem('users')) || {};

                if (users[username] && users[username].password === password) {
                    sessionStorage.setItem('loggedInUser', username);
                    window.location.href = 'exercise_map.html';
                } else {
                    document.getElementById('form-error').textContent = 'That username or password does not match. Please try again.';
                }
            });
        </script>
    </body>
</html>
