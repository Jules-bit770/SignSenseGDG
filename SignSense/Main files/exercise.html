<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SignSense Exercise</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
<style>:root{--bg:#080b12;--panel:#111827;--line:#263249;--text:#edf4ff;--muted:#9caec8;--blue:#38bdf8;--green:#36d399;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,Segoe UI,sans-serif}.top{max-width:1200px;margin:auto;padding:22px 24px 0;display:flex;justify-content:space-between;align-items:center}.back{color:var(--blue);text-decoration:none}.badge{font-size:12px;color:var(--green);font-weight:800;letter-spacing:.1em}main{max-width:1200px;margin:auto;padding:20px 24px 40px}h1{margin:4px 0 5px;font-size:30px}.status{color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}.panel-head{padding:12px 15px;border-bottom:1px solid var(--line);font-weight:700}.media{aspect-ratio:4/3;background:#03060b;position:relative}.media video,.media canvas{width:100%;height:100%;object-fit:cover}.media canvas{position:absolute;inset:0;transform:scaleX(-1)}.media .cam{transform:scaleX(-1)}.hint{position:absolute;bottom:12px;left:12px;background:#0b1220dd;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--muted);font-size:12px}.controls{padding:15px;display:flex;gap:10px}.btn{border:0;border-radius:9px;padding:12px 15px;font-weight:800;cursor:pointer;background:var(--blue);color:#06111b}.btn.secondary{background:#1b2639;color:var(--text);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.score{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}.score strong{font-size:38px;color:var(--blue)}.bar{height:8px;background:#202a3a;border-radius:5px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--green);width:0%;transition:.3s}.list{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}.item{border:1px solid var(--line);border-radius:8px;padding:9px;color:var(--muted);display:flex;justify-content:space-between}.item.current{border-color:var(--blue);color:var(--text);background:#132238}.item.done{border-color:#29785f;color:#b6f3dd}@media(max-width:760px){.grid{grid-template-columns:1fr}.top,main{padding-left:15px;padding-right:15px}}</style></head>
<body><header class="top"><a class="back" href="exercise_map.html">← Exercise map</a><span class="badge" id="exercise-label">EXERCISE</span></header><main><h1 id="sign-title">Loading reference…</h1><p class="status" id="status">Preparing the reference video.</p><section class="grid"><div class="panel"><div class="panel-head">Your camera</div><div class="media"><video id="camera" class="cam" playsinline></video><canvas id="canvas" width="640" height="480"></canvas><span class="hint" id="camera-state">Camera off</span></div><div class="controls"><button class="btn secondary" id="camera-btn">Start camera</button><button class="btn" id="record-btn" disabled>Record best 1.5s score</button></div></div><div class="panel"><div class="panel-head">Reference video</div><div class="media"><video id="reference" controls loop muted autoplay playsinline></video><span class="hint" id="template-state">Preparing DTW reference…</span></div><div class="controls"><button class="btn secondary" id="replay-btn">Replay</button><button class="btn" id="next-btn" disabled>Next sign →</button></div></div></section><section class="score"><span id="score-label">Live confidence</span><strong id="score">—</strong><div class="bar"><i id="bar"></i></div></section><section class="list"><b>Signs in this exercise</b><div class="items" id="items"></div></section></main>
<script>
const EXERCISES={1:['BYE','HELLO','HOW ARE YOU','NO','OKAY','PLEASE','SORRY','STOP','THANK YOU','YES','MY1','MY2','NAME1','NAME2'],2:['AT','BAD','GOOD','HOW','I','LOVE','WHAT','WHEN','WHERE','WHICH','WHO','WHY','YOU'],3:['BABY','BROTHER','FAMILY','FATHER','FRIEND','MOTHER','PERSON','SCHOOL','SISTER']};
// Keep this explicit map beside the exercise lists. It avoids any server API or
// directory listing: a basic local HTTP server can serve the reference MP4s.
const SOURCES={BYE:'bye.mp4',HELLO:'hello.mp4','HOW ARE YOU':'how_are_you.mp4',NO:'No.mp4',OKAY:'okay.mp4',PLEASE:'please.mp4',SORRY:'sorry.mp4',STOP:'stop.mp4','THANK YOU':'thank_you.mp4',YES:'Yes.mp4',MY1:'my1.mp4',MY2:'my2.mp4',NAME1:'name1.mp4',NAME2:'name2.mp4',AT:'at.mp4',BAD:'bad.mp4',GOOD:'good.mp4',HOW:'how.mp4',I:'I.mp4',LOVE:'love.mp4',WHAT:'what.mp4',WHEN:'when.mp4',WHERE:'where.mp4',WHICH:'which.mp4',WHO:'who.mp4',WHY:'why.mp4',YOU:'you.mp4',BABY:'baby.mp4',BROTHER:'brother.mp4',FAMILY:'family.mp4',FATHER:'father.mp4',FRIEND:'friend.mp4',MOTHER:'mother.mp4',PERSON:'person.mp4',SCHOOL:'school.mp4',SISTER:'sister.mp4'};
const q=new URLSearchParams(location.search),number=Number(q.get('exercise'))||1,signs=EXERCISES[number]||EXERCISES[1],videoByLabel=Object.fromEntries(Object.entries(SOURCES).map(([label,name])=>[label,{url:`dynamic_signs/${name}`}])) ;let index=0,template=null,recording=false,frames=[],stream=null,ready=false,scores={},liveFrames=[],liveFrameCount=0;
const $=id=>document.getElementById(id),camera=$('camera'),canvas=$('canvas'),ctx=canvas.getContext('2d'),reference=$('reference');$('exercise-label').textContent=`EXERCISE ${number}`;
function feature(r){const out=new Float32Array(84);const pose=r.poseLandmarks||[],neck=pose[11]&&pose[12]?{x:(pose[11].x+pose[12].x)/2,y:(pose[11].y+pose[12].y)/2}:{x:.5,y:.5};const scale=pose[11]&&pose[12]?Math.max(.08,Math.hypot(pose[11].x-pose[12].x,pose[11].y-pose[12].y)):.25;for(const [hand,offset] of [[r.leftHandLandmarks,0],[r.rightHandLandmarks,42]])if(hand)hand.forEach((p,i)=>{out[offset+i*2]=(p.x-neck.x)/scale;out[offset+i*2+1]=(p.y-neck.y)/scale});return out}
const userHolistic=new Holistic({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${f}`});const refHolistic=new Holistic({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${f}`});for(const h of [userHolistic,refHolistic])h.setOptions({modelComplexity:1,smoothLandmarks:true,enableSegmentation:false,refineFaceLandmarks:false,minDetectionConfidence:.45,minTrackingConfidence:.45});
userHolistic.onResults(r=>{ctx.clearRect(0,0,640,480);if(r.leftHandLandmarks){drawConnectors(ctx,r.leftHandLandmarks,HAND_CONNECTIONS,{color:'#38bdf8',lineWidth:2});drawLandmarks(ctx,r.leftHandLandmarks,{color:'#38bdf8',radius:2})}if(r.rightHandLandmarks){drawConnectors(ctx,r.rightHandLandmarks,HAND_CONNECTIONS,{color:'#36d399',lineWidth:2});drawLandmarks(ctx,r.rightHandLandmarks,{color:'#36d399',radius:2})}const current=feature(r);if(recording)frames.push(current);if(ready&&stream){liveFrames.push(current);if(liveFrames.length>120)liveFrames.shift();liveFrameCount++;const candidate=prepareTrajectory(liveFrames);if(candidate.length>=8&&liveFrameCount%8===0)updateLiveScore(dtw(candidate,template))}});let refFrames=null;refHolistic.onResults(r=>{if(refFrames)refFrames.push(feature(r))});
function renderList(){ $('items').innerHTML=signs.map((s,i)=>`<div class="item ${i===index?'current':''} ${scores[s]!=null?'done':''}"><span>${s}</span><b>${scores[s]!=null?scores[s]+'%':'—'}</b></div>`).join('') }
function frameMotion(a,b){let total=0,count=0;for(let k=0;k<84;k+=2){const active=a[k]!==0||a[k+1]!==0||b[k]!==0||b[k+1]!==0;if(active){total+=Math.hypot(a[k]-b[k],a[k+1]-b[k+1]);count++}}return count?total/count:0}
function prepareTrajectory(input){if(input.length<3)return input;const moving=[];for(let i=1;i<input.length;i++)if(frameMotion(input[i-1],input[i])>.012)moving.push(i);if(!moving.length)return input;const start=Math.max(0,moving[0]-4),end=Math.min(input.length-1,moving[moving.length-1]+5);return input.slice(start,end+1)}
function limitFrames(input,maxFrames=90){if(input.length<=maxFrames)return input;return Array.from({length:maxFrames},(_,i)=>input[Math.round(i*(input.length-1)/(maxFrames-1))])}
function dtw(a,b){a=limitFrames(prepareTrajectory(a));b=limitFrames(prepareTrajectory(b));const n=a.length,m=b.length;if(!n||!m)return 0;const d=Array.from({length:n+1},()=>new Float32Array(m+1).fill(1e6));d[0][0]=0;for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){let sum=0;for(let k=0;k<84;k++){const x=a[i-1][k]-b[j-1][k];sum+=x*x}d[i][j]=Math.sqrt(sum)+Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1])}const cost=d[n][m]/Math.max(n,m);return Math.max(0,Math.min(100,Math.round(100/(1+Math.exp(1.15*(cost-2.1))))))}
function verifyDtw(){const match=Array.from({length:30},(_,i)=>Float32Array.from({length:84},()=>i/30));const mismatch=Array.from({length:30},()=>Float32Array.from({length:84},()=>8));const same=dtw(match,match),different=dtw(match,mismatch),passed=same>=90&&different<50;console.info(`DTW self-check: identical=${same}%, mismatch=${different}%, ${passed?'passed':'failed'}`);return passed}
const dtwVerified=verifyDtw();
function updateLiveScore(value){const sign=signs[index];$('score').textContent=value+'%';$('bar').style.width=value+'%';$('score-label').textContent='Live confidence';$('camera-state').textContent=`Live DTW: ${value}%`;if(scores[sign]===undefined||value>scores[sign]){scores[sign]=value;renderList()}}
function wait(video,event){return new Promise((ok,bad)=>{video.addEventListener(event,ok,{once:true});video.addEventListener('error',()=>bad(new Error('Video could not be read')),{once:true})})}async function seek(video,t){await new Promise((ok,bad)=>{video.addEventListener('seeked',ok,{once:true});video.addEventListener('error',()=>bad(new Error('Video seek failed')),{once:true});video.currentTime=Math.max(.001,Math.min(t,video.duration-.001))})}
async function buildTemplate(){ready=false;template=null;liveFrames=[];liveFrameCount=0;$('record-btn').disabled=true;$('next-btn').disabled=true;$('template-state').textContent='Building DTW reference…';const current=signs[index],v=videoByLabel[current];if(!v){$('status').textContent=`Missing ${current}.mp4 in dynamic_signs.`;$('template-state').textContent='Reference missing';return}reference.src=v.url;reference.play().catch(()=>{});try{await wait(reference,'loadedmetadata');const sample=[];refFrames=sample;for(let i=0;i<30;i++){await seek(reference,i*reference.duration/30);await refHolistic.send({image:reference})}refFrames=null;template=prepareTrajectory(sample);if(template.length<8)throw new Error('Hands were not detected in enough reference frames');if(!dtwVerified)throw new Error('DTW self-check failed');ready=true;$('template-state').textContent='DTW reference ready · self-check passed';$('next-btn').disabled=false;$('record-btn').disabled=!stream;$('status').textContent='Live DTW adapts to your signing speed. Copy the sign and watch the confidence score update.'}catch(e){refFrames=null;$('template-state').textContent='Could not build template';$('status').textContent=e.message}}
async function showSign(){const sign=signs[index];$('sign-title').textContent=`${sign} · ${index+1} of ${signs.length}`;$('score').textContent=scores[sign]!=null?scores[sign]+'%':'—';$('bar').style.width=(scores[sign]||0)+'%';renderList();await buildTemplate()}
async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:true});camera.srcObject=stream;await camera.play();$('camera-state').textContent='Camera active';$('camera-btn').textContent='Camera active';$('camera-btn').disabled=true;if(ready)$('record-btn').disabled=false;const loop=async()=>{if(stream&&camera.readyState>=2)await userHolistic.send({image:camera});if(stream)requestAnimationFrame(loop)};loop()}catch(e){$('camera-state').textContent='Camera blocked';$('status').textContent='Allow camera access, then try again.'}}
$('camera-btn').onclick=startCamera;$('replay-btn').onclick=()=>{reference.currentTime=0;reference.play()};$('record-btn').onclick=()=>{if(!ready)return;recording=true;frames=[];$('record-btn').disabled=true;$('record-btn').textContent='Recording…';setTimeout(()=>{recording=false;updateLiveScore(frames.length>=8?dtw(frames,template):0);$('score-label').textContent='Recorded confidence';$('record-btn').textContent='Record best 1.5s score';$('record-btn').disabled=false},1500)};$('next-btn').onclick=()=>{index=(index+1)%signs.length;showSign()};
showSign();
</script></body></html>
